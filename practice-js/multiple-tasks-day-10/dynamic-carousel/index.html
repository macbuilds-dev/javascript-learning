<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Carousel</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #222;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: "Poppins", sans-serif;
      }

      .carousel-container {
        position: relative;
        width: 800px;
        height: 400px;
        overflow: hidden;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      .carousel img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
      }

      .carousel img.active {
        opacity: 1;
      }

      button {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255, 255, 255, 0.6);
        border: none;
        cursor: pointer;
        font-size: 24px;
        padding: 10px 15px;
        border-radius: 50%;
        transition: background 0.3s;
      }

      button:hover {
        background: rgba(255, 255, 255, 0.8);
      }

      .prev {
        left: 10px;
      }

      .next {
        right: 10px;
      }

      .dots {
        position: absolute;
        bottom: 15px;
        width: 100%;
        text-align: center;
      }

      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin: 5px;
        background: #fff;
        border-radius: 50%;
        opacity: 0.5;
        cursor: pointer;
        transition: opacity 0.3s, background 0.3s;
      }

      .dot.active {
        opacity: 1;
        background: #ff9800;
      }
    </style>
  </head>

  <body>
    <div class="carousel-container">
      <div class="carousel">
        <img src="https://picsum.photos/id/1015/800/400" class="active" alt="Slide 1" />
        <img src="https://picsum.photos/id/1016/800/400" alt="Slide 2" />
        <img src="https://picsum.photos/id/1018/800/400" alt="Slide 3" />
        <img src="https://picsum.photos/id/1024/800/400" alt="Slide 4" />
      </div>

      <button class="prev">❮</button>
      <button class="next">❯</button>
      <div class="dots"></div>
    </div>

    <script src="assets/scripts/app.js"></script>
  </body>
</html>
