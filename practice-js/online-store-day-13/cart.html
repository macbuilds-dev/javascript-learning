<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAC Store/cart</title>
  <link rel="stylesheet" href="assets\styles\cart.css" />
</head>
<body>
  <div class="cart-container">
    <h2>MAC Store</h2>
    <h3><b>Your Cart</b></h3>

    <button class="menu-btn">☰ Options</button>

    <div class="cart-item-list">
      <div class="cart-item">
        <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f" alt="Product">
        <div class="item-details">
          <h4><b>Leather Purse</b></h4>
          <p>Classic handmade brown leather purse.</p>
        </div>
        <div class="item-price">
          <h4>Rs. 2500</h4>
          <p>Rating: 3/5</p>
          <button>Buy Now</button>
        </div>
      </div>
      <div class="cart-item">
        <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f" alt="Product">
        <div class="item-details">
          <h4><b>Shoulder Bag</b></h4>
          <p>Stylish and durable shoulder bag for everyday use.</p>
        </div>
        <div class="item-price">
          <h4>Rs. 3200</h4>
          <p>Rating: 4/5</p>
          <button>Buy Now</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
